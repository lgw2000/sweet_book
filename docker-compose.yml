services:
  web:
    build:
      context: ./simple-web
      dockerfile: Dockerfile
    ports:
      # Change the left side to change the host port, for example "3000:8000".
      - "3000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/users.db
      SWEET_BOOK_ADMIN_ID: ${SWEET_BOOK_ADMIN_ID:-admin}
      SWEET_BOOK_ADMIN_PASSWORD: ${SWEET_BOOK_ADMIN_PASSWORD:-admin1234}
      SWEET_BOOK_SEED_SAMPLE: ${SWEET_BOOK_SEED_SAMPLE:-true}
      SWEET_BOOK_SAMPLE_PRIMARY_ID: ${SWEET_BOOK_SAMPLE_PRIMARY_ID:-sample_writer}
      SWEET_BOOK_SAMPLE_PRIMARY_PASSWORD: ${SWEET_BOOK_SAMPLE_PRIMARY_PASSWORD:-sample_writer123}
      SWEET_BOOK_SAMPLE_SECONDARY_ID: ${SWEET_BOOK_SAMPLE_SECONDARY_ID:-sample_reader}
      SWEET_BOOK_SAMPLE_SECONDARY_PASSWORD: ${SWEET_BOOK_SAMPLE_SECONDARY_PASSWORD:-sample_reader123}
    volumes:
      - ./simple-web/data:/app/data
      - ./simple-web/static/uploads:/app/static/uploads
    restart: unless-stopped
